name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The catalog freshness check skips itself without a local claude CLI;
      # the wire tests run against a stub claude and need no dependencies.
      - run: npm test