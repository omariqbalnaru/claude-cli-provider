name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The wire tests drive a stub claude on PATH: no seat, no quota, no
      # network. The install is for the type-check (typescript and the pi SDK
      # types); the extension sources are never type-checked without it.
      - run: npm install --no-audit --no-fund
      - run: npm test
